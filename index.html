<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiển thị ảnh FlickTale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Đảm bảo font Inter được sử dụng */
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-semibold text-white text-center mb-4">Ảnh FlickTale</h1>
        <img
            src="FlickTale.jpg"
            alt="Logo FlickTale"
            class="block mx-auto max-w-full h-auto rounded-md"
            onerror="this.onerror=null; this.src='https://placehold.co/600x400/1f2937/ffffff?text=Kh%C3%B4ng+t%E1%BA%A3i+%C4%91%C6%B0%E1%BB%A3c+%E1%BA%A3nh'; this.alt='Ảnh bị lỗi'"
        >
        <p class="text-gray-400 text-center mt-4 text-sm">Đây là ảnh bạn đã tải lên.</p>
    </div>
</body>
</html>
